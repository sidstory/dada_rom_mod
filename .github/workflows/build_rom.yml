name: Build ROM for dada
on:
  workflow_dispatch:
    inputs:
      VENDOR_URL:
        description: "底包下载地址"
        required: true
        default: 'https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.0.7.XOCCNXM/dada-ota_full-OS4.0.0.7.XOCCNXM-user-17.0-832125be27.zip'
      KSU:
        description: "是否集成 KernelSU"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 最大化构建环境
        uses: AdityaGarg8/remove-unwanted-software@v3
        with:
          swap-size-mb: 8192
          root-reserve-mb: 4096
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
      - name: 检出仓库文件
        uses: actions/checkout@v4
      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 cpio python3
      - name: 构建 ROM
        run: |
          sudo ln -sf "$GITHUB_WORKSPACE"/tools/zstd /usr/local/bin/zstd
          sudo KSU=${{ github.event.inputs.KSU }} bash "$GITHUB_WORKSPACE"/make.sh "${{ github.event.inputs.VENDOR_URL }}" "$GITHUB_ENV" "$GITHUB_WORKSPACE"
          ls "$GITHUB_WORKSPACE"/zip/*.zip || { echo "::error::ROM 卡刷包生成失败"; exit 1; }
      - name: 处理 ROM
        run: |
          mkdir -p "$GITHUB_WORKSPACE"/GithubRelease
          cd "$GITHUB_WORKSPACE"/GithubRelease
          sudo split -b 1536M -d "$GITHUB_WORKSPACE"/zip/"$rom_name" "$rom_name"
          echo "$MD5  $rom_name" > "$rom_name.md5"
          cd "$GITHUB_WORKSPACE"
          {
            echo "ROM: $rom_name"
            echo "MD5: $MD5"
            echo "底包版本: $vendor_os_version"
            echo "Android 版本: $android_version"
            echo "构建时间: $build_time"
          } > file.log
          echo "release_tag=${rom_name%.zip}" >> "$GITHUB_ENV"
      - name: 上传到 Github Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: ${{ github.workspace }}/GithubRelease/*
          name: ${{ env.release_tag }}
          tag: ${{ env.release_tag }}
          bodyFile: ${{ github.workspace }}/file.log
          allowUpdates: true
          artifactErrorsFailBuild: true
